      summary: Изменить сцену
      operationId: updateScene
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
        - $ref: '../components/parameters.yml#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/UpdateSceneRequest'
      responses:
        '200':
          description: Сцена обновлена
          content:
            application/json:
              schema:
