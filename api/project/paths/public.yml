        '404':
          description: Сцена или проект не найдено
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
    delete:
      tags:
        - Project Module
      summary: Удалить сцену
      operationId: deleteScene
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
        - $ref: '../components/parameters.yml#/components/parameters/SceneId'
      responses:
        '204':
          description: Сцена удалена
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Сцена или проект не найдено
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}/scenes/{sceneId}/furniture:
    post:
      tags:
        - Project Module
      summary: Добавить мебель в сцену
      operationId: addFurnitureToScene
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
        - $ref: '../components/parameters.yml#/components/parameters/SceneId'
