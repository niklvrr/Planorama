paths:
  /projects:
    post:
      tags:
        - Project Module
      summary: Создать проект
      operationId: createProject
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/ProjectResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '409':
          description: Проект уже существует
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
    get:
      tags:
        - Project Module
      summary: Получить список проектов
      operationId: listProjects
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../../common/components/parameters.yml#/components/parameters/PageParam'
        - $ref: '../../common/components/parameters.yml#/components/parameters/LimitParam'
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/ProjectListResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}:
    get:
      tags:
        - Project Module
      summary: Открыть проект
      operationId: getProject
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
      responses:
        '200':
          description: Данные проекта
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/ProjectResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
    put:
      tags:
        - Project Module
      summary: Изменить проект
      operationId: updateProject
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Проект обновлен
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/ProjectResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
    delete:
      tags:
        - Project Module
      summary: Удалить проект
      operationId: deleteProject
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
      responses:
        '204':
          description: Проект удален
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}/scenes:
    post:
      tags:
        - Project Module
      summary: Создать сцену по чертежу
      operationId: createSceneFromBlueprint
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/CreateSceneFromBlueprintRequest'
      responses:
        '201':
          description: Сцена создана
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/SceneResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}/scenes/from-photo:
    post:
      tags:
        - Project Module
      summary: Создать сцену по фото
      operationId: createSceneFromPhoto
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/CreateSceneFromPhotoRequest'
      responses:
        '201':
          description: Сцена создана
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/SceneResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}/scenes/{sceneId}:
    get:
      tags:
        - Project Module
      summary: Открыть сцену
      operationId: getScene
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
        - $ref: '../components/parameters.yml#/components/parameters/SceneId'
