        '204':
          description: Материал удален
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Материал или сцена или проект не найдено
