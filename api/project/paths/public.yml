      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/ImportFurnitureFromModelRequest'
      responses:
        '201':
          description: Мебель импортирована
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/FurnitureInSceneResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
