      tags:
        - Project Module
      summary: Удалить мебель из сцены
      operationId: removeFurnitureFromScene
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '../components/parameters.yml#/components/parameters/ProjectId'
        - $ref: '../components/parameters.yml#/components/parameters/SceneId'
        - name: furnitureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Мебель удалена
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Мебель или сцена или проект не найдено
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /projects/{projectId}/scenes/{sceneId}/materials:
