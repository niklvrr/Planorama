components:
  schemas:
    # ==== REQUESTS ====
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: example123

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: example123
        firstName:
          type: string
          example: Ivan
        lastName:
          type: string
          example: Ivanov

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    ChangeEmailRequest:
      type: object
      required:
        - currentEmail
        - newEmail
      properties:
        currentEmail:
          type: string
          format: email
        newEmail:
          type: string
          format: email

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password


    # ==== RESPONSE ====
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
        refreshToken:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: user@example.com
        firstName:
          type: string
          example: Ivan
        lastName:
          type: string
          example: Ivanov
        isBlocked:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          $ref: '../../common/components/schemas.yml#/components/schemas/Pagination'