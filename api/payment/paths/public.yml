paths:
  /payments:
    post:
      tags:
        - Payment Module
      summary: Создание платежа
      operationId: createPayment
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Платеж создан
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/PaymentResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /payments/{paymentId}:
    get:
      tags:
        - Payment Module
      summary: Проверка статуса платежа
      operationId: checkPaymentStatus
      security:
        - BearerAuth: [ ]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/PaymentStatusResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Платеж не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

    post:
      tags:
        - Payment Module
      summary: Возврат средств
      operationId: refundPayment
      security:
        - BearerAuth: [ ]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Возврат инициирован
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/RefundResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Платеж не найден
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /payments/webhook:
    post:
      tags:
        - Payment Module
      summary: Обработка уведомлений от платежной системы
      operationId: handlePaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Уведомление обработано
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/SuccessResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /subscriptions:
    get:
      tags:
        - Payment Module
      summary: Получить текущую подписку пользователя
      operationId: getCurrentSubscription
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Данные текущей подписки
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/SubscriptionResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Подписка не найдена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /subscriptions/cancel:
    post:
      tags:
        - Payment Module
      summary: Отменить подписку
      operationId: cancelSubscription
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Подписка отменена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/SuccessResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Подписка не найдена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'