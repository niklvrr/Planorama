paths:
  /admin/catalog/categories:
  post:
    tags:
      - Catalog Module
    summary: Создать категорию
    operationId: createCategory
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/components/schemas/CreateCategoryRequest'
    responses:
      '201':
        description: Категория создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/CategoryResponse'
      '400':
        description: Некорректные данные
        content:
          application/json:
            schema:
              $ref: '../../common/components/schemas.yml#/components/schemas/Error'
      '401':
        description: Пользователь не авторизован
        content:
          application/json:
            schema:
              $ref: '../../common/components/schemas.yml#/components/schemas/Error'
      '403':
        description: Недостаточно прав
        content:
          application/json:
            schema:
              $ref: '../../common/components/schemas.yml#/components/schemas/Error'

  /admin/catalog/categories/{categoryId}:
    put:
      tags:
        - Catalog Module
      summary: Изменить категорию
      operationId: updateCategory
      security:
        - BearerAuth: [ ]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yml#/components/schemas/CategoryResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
    delete:
      tags:
        - Catalog Module
      summary: Удалить категорию
      operationId: deleteCategory
      security:
        - BearerAuth: [ ]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Категория удалена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/SuccessResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'
        '404':
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '../../common/components/schemas.yml#/components/schemas/Error'

